services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ad_insight
      POSTGRES_USER: ad_user
      POSTGRES_PASSWORD: ad_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ad_user -d ad_insight"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8080"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://ad_user:ad_password@db:5432/ad_insight
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c 'echo "Backend: http://localhost:8000/docs" &&
      uv run --no-dev uvicorn app.main:app
      --host 0.0.0.0 --port 8080'

volumes:
  postgres_data:
